name: Bootstrap backlog

# One-shot workflow: create labels, LearnMap project board, and add open
# backlog issues to the Backlog status. Safe to re-run (idempotent).

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  bootstrap:
    name: Labels + Project + Backlog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          create_label() {
            local name="$1" color="$2" desc="$3"
            if gh label list -R "$GITHUB_REPOSITORY" --json name --jq '.[].name' | grep -Fxq "$name"; then
              echo "Label exists: $name"
            else
              gh label create "$name" -R "$GITHUB_REPOSITORY" --color "$color" --description "$desc"
            fi
          }
          create_label "epic" "7B2D8B" "Large initiative spanning multiple features"
          create_label "feature" "0075CA" "Feature or user story"
          create_label "task" "0E8A16" "Implementation or operational task"
          create_label "spike" "E4812B" "Research or investigation"
          create_label "P0" "B60205" "Critical — blocking, needs immediate attention"
          create_label "P1" "E11D48" "High — important, address in current cycle"
          create_label "P2" "FBCA04" "Medium — plan for near-term"
          create_label "P3" "C2E0C6" "Low — nice to have"
          create_label "backlog" "ededed" "Product backlog item"

      - name: Ensure LearnMap project exists
        id: project
        env:
          GH_TOKEN: ${{ secrets.LEARNMAP_PAT }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            export GH_TOKEN="$FALLBACK_TOKEN"
            echo "LEARNMAP_PAT not set; falling back to GITHUB_TOKEN"
          fi
          ORG="${GITHUB_REPOSITORY_OWNER}"
          TITLE="LearnMap"

          PROJECT_JSON=$(gh project list --owner "$ORG" --format json 2>/dev/null || echo '[]')
          NUMBER=$(echo "$PROJECT_JSON" | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          projects = data if isinstance(data, list) else data.get('projects', [])
          for p in projects:
              if p.get('title') == 'LearnMap':
                  print(p.get('number', ''))
                  break
          ")

          if [ -z "${NUMBER}" ]; then
            echo "Creating project '$TITLE' under $ORG..."
            if ! CREATE_OUT=$(gh project create --owner "$ORG" --title "$TITLE" --format json 2>&1); then
              echo "Project create failed: $CREATE_OUT"
              echo "created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            NUMBER=$(echo "$CREATE_OUT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('number',''))")
          fi

          if [ -z "${NUMBER}" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROJECT_ID=$(gh project view "$NUMBER" --owner "$ORG" --format json --jq '.id')
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Project: https://github.com/orgs/${ORG}/projects/${NUMBER}"

      - name: Add open issues to project Backlog
        if: steps.project.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.LEARNMAP_PAT }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ steps.project.outputs.number }}
          PROJECT_ID: ${{ steps.project.outputs.id }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            export GH_TOKEN="$FALLBACK_TOKEN"
          fi
          ORG="${GITHUB_REPOSITORY_OWNER}"
          FIELD_JSON=$(gh project field-list "$PROJECT_NUMBER" --owner "$ORG" --format json)
          export STATUS_ID BACKLOG_OPTION
          STATUS_ID=$(echo "$FIELD_JSON" | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          fields = data if isinstance(data, list) else data.get('fields', [])
          for f in fields:
              if f.get('name') == 'Status':
                  print(f['id'])
                  break
          ")
          BACKLOG_OPTION=$(echo "$FIELD_JSON" | python3 -c "
          import json,sys
          data=json.load(sys.stdin)
          fields = data if isinstance(data, list) else data.get('fields', [])
          for f in fields:
              if f.get('name') == 'Status':
                  options = f.get('options') or []
                  for want in ('Backlog', 'Todo', 'No Status'):
                      for o in options:
                          if o.get('name') == want:
                              print(o['id'])
                              raise SystemExit
                  if options:
                      print(options[0]['id'])
                  break
          ")
          echo "Status field=$STATUS_ID backlog_option=$BACKLOG_OPTION"

          gh issue list -R "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title,url > /tmp/issues.json
          python3 <<'PY'
          import json, os, subprocess

          issues = json.load(open("/tmp/issues.json"))
          org = os.environ["GITHUB_REPOSITORY_OWNER"]
          project_number = os.environ["PROJECT_NUMBER"]
          project_id = os.environ["PROJECT_ID"]
          status_id = os.environ.get("STATUS_ID", "")
          backlog = os.environ.get("BACKLOG_OPTION", "")

          for issue in issues:
              title = issue["title"]
              if title.startswith("TEST:"):
                  print(f"Skipping #{issue['number']}: {title}")
                  continue
              url = issue["url"]
              print(f"Adding #{issue['number']} {title}")
              try:
                  item_json = subprocess.check_output(
                      [
                          "gh", "project", "item-add", project_number,
                          "--owner", org,
                          "--url", url,
                          "--format", "json",
                      ],
                      text=True,
                  )
                  item_id = json.loads(item_json).get("id")
                  if item_id and status_id and backlog:
                      subprocess.check_call(
                          [
                              "gh", "project", "item-edit",
                              "--project-id", project_id,
                              "--id", item_id,
                              "--field-id", status_id,
                              "--single-select-option-id", backlog,
                          ]
                      )
              except subprocess.CalledProcessError as exc:
                  print(f"  warn: {exc}")
          print("Done adding issues to project")
          PY
